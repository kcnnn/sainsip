[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sainsip"
version = "0.1.0"
description = "Sovereign AI Network State In Space"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools]
packages = ["sainsip", "sainsip.api", "sainsip.models", "sainsip.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
