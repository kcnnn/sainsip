{% extends "base.html" %}
{% block title %}Proposals{% endblock %}
{% block content %}

<div class="container">
    <div class="page-header">
        <h1>Governance Proposals</h1>
        <p>Decisions that shape the network state. Every proposal is a potential law, policy, or constitutional amendment.</p>
    </div>

    <!-- Status Filter -->
    <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;">
        <button class="btn btn-secondary" onclick="loadProposals()">All</button>
        <button class="btn btn-secondary" onclick="loadProposals('active')">Active</button>
        <button class="btn btn-secondary" onclick="loadProposals('passed')">Passed</button>
        <button class="btn btn-secondary" onclick="loadProposals('failed')">Failed</button>
    </div>

    <!-- Proposal List -->
    <div id="proposal-list">
        <div class="loading">Loading proposals</div>
    </div>
</div>

{% endblock %}
